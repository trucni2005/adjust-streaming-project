services:
  trino:
    image: trinodb/trino:latest
    container_name: trino
    depends_on:
      - iceberg-rest
    ports:
      - "8050:8050"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./trino/etc/config.properties:/etc/trino/config.properties
    networks:
      - kafka-net

  # Metabase Service
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_HOST: tooling-db
      MB_DB_PORT: 5435
      MB_DB_USER: admin
      MB_DB_PASS: admin
      MB_PLUGINS_DIR: /tmp/metabase_plugins
    depends_on:
      - tooling-db
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge
