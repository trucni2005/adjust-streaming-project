services:
  postgres:
    image: postgres:16.10-bookworm
    container_name: postgres
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_DB: ${PG_DATABASE:?PG_DATABASE must be set}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Dùng bởi ddl/postgresql/02-roles.sh để tạo user cho simulator và Debezium.
      PG_APP_USER: ${PG_USER:?PG_USER must be set}
      PG_APP_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set}
      PG_DEBEZIUM_USER: ${PG_DEBEZIUM_USER:?PG_DEBEZIUM_USER must be set}
      PG_DEBEZIUM_PASSWORD: ${PG_DEBEZIUM_PASSWORD:?PG_DEBEZIUM_PASSWORD must be set}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    secrets:
      - pg_superuser_password
    volumes:
      - ./postgres-db-volumes:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./ddl/postgresql:/docker-entrypoint-initdb.d:ro
    # Docker mặc định /dev/shm = 64MB, không đủ cho parallel query.
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # shared_buffers/effective_cache_size trong postgresql.conf tính theo limit này.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Cho Postgres đủ thời gian checkpoint trước khi bị SIGKILL.
    stop_grace_period: 60s
    restart: unless-stopped
    networks:
      - backend-net

secrets:
  pg_superuser_password:
    file: ./secrets/pg_superuser_password

networks:
  # Vùng mạng của backend (OLTP): chỉ postgres, simulator (đóng vai backend app)
  # và kconnect (cầu nối CDC duy nhất sang data platform) được gắn vào.
  backend-net:
    driver: bridge
