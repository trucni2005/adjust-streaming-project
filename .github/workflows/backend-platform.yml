# Backend (OLTP): postgres + simulator. Chỉ chạy khi đổi file thuộc backend
# hoặc file dùng chung (Dockerfile, requirements, compose entrypoint, .env.example).
name: backend-platform

on:
  push:
    branches: [main]
    paths: &backend-paths
      - compose/postgres.yml
      - compose/simulator.yml
      - config/postgres/**
      - ddl/postgresql/**
      - simulator/**
      - tests/postgres/**
      - tests/simulator/**
      - Dockerfile
      - requirements.txt
      - pyproject.toml
      - docker-compose.yml
      - .env.example
      - Makefile
      - .github/workflows/backend-platform.yml
  pull_request:
    branches: [main]
    paths: *backend-paths

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: ruff check simulator tests/postgres tests/simulator

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      # tests/postgres tự skip khi không có DB đang chạy.
      - run: pytest tests/simulator tests/postgres -v -rs

  docker-build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target simulator -t simulator .
      # .env bị gitignore nên runner không có; dùng giá trị mẫu chỉ để validate compose.
      - run: cp .env.example .env
      - run: docker compose config -q
