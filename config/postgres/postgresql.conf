# Thay thế hoàn toàn postgresql.conf mặc định trong data dir
# (compose/postgres.yml chạy postgres -c config_file=...), nên phải tự khai báo
# những giá trị initdb thường sinh ra (listen_addresses, lc_*...).
# Tài nguyên tính theo limit của container: 2 CPU / 2GB RAM.

# --- Kết nối -----------------------------------------------------------------
listen_addresses = '*'
max_connections = 100
password_encryption = scram-sha-256
idle_in_transaction_session_timeout = 60s

# --- Locale / timezone ---------------------------------------------------------
# Giữ Asia/Ho_Chi_Minh: các cột adjust.event là TIMESTAMP (không tz), simulator
# ghi NOW() và datetime UTC nên giá trị lưu đang là giờ VN. Đổi sang UTC chỉ an
# toàn khi migrate cột sang TIMESTAMPTZ cùng với schema Avro/bronze.
timezone = 'Asia/Ho_Chi_Minh'
log_timezone = 'Asia/Ho_Chi_Minh'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# --- Bộ nhớ --------------------------------------------------------------------
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 128MB
dynamic_shared_memory_type = posix

# --- WAL / checkpoint ----------------------------------------------------------
wal_compression = on
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# --- Logical replication (Debezium) --------------------------------------------
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10
# Chặn replication slot "treo" (kconnect chết) giữ WAL vô hạn làm đầy disk.
# Vượt ngưỡng thì slot bị invalidate, connector phải snapshot lại.
max_slot_wal_keep_size = 10GB

# --- Planner -------------------------------------------------------------------
random_page_cost = 1.1

# --- Logging -------------------------------------------------------------------
log_min_duration_statement = 500ms
log_connections = on
log_disconnections = on
log_lock_waits = on
log_replication_commands = on
log_autovacuum_min_duration = 10s
log_line_prefix = '%m [%p] %q%u@%d '
