networks:
  kafka-net:
    driver: bridge

x-kafka-common: &kafka-common
  KAFKA_PROCESS_ROLES: 'broker,controller'
  # Vote Controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9093,2@kafka2:9093,3@kafka3:9093'
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
  KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
  KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
  CLUSTER_ID: '0gDt4nK2qFB0RwIyKQpS7Kl5rglxiRyEmFwvGZP3ug'
  # 3 replication mỗi topic consumer_offset
  KAFKA_OFFSET_TOPIC_REPLICATION_FACTOR: 3
  # rebalance ngay lập tức
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # 3 replication mặc định cho mỗi topic thông thường
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  # từ 2 replication xác nhận có bản sao thì mới cho đọc/ghi -> nếu ko thì trả lỗi
  KAFKA_MIN_INSYNC_REPLICAS: 2
  # Xóa log segment cũ hơn 1h để không giữ dữ liệu vô thời hạn trên đĩa
  KAFKA_LOG_RETENTION_MS: 360000
  # Giới hạn thêm theo dung lượng mỗi partition (1GB) phòng khi throughput cao trong 2h
  KAFKA_LOG_RETENTION_BYTES: 1073741824
  # Broker check định kỳ 1 phút để dọn log hết hạn kịp
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
  # Dùng delete policy (không phải compact) để thực sự xóa log cũ
  KAFKA_LOG_CLEANUP_POLICY: delete
  # Giảm segment size xuống 100MB để buộc roll over nhanh hơn (mặc định 1GB)
  KAFKA_LOG_SEGMENT_BYTES: 104857600
  KAFKA_NUM_PARTITIONS: 4
  KAFKA_CONTROLLER_QUORUM_ELECTION_TIMEOUT_MS: 5000
  KAFKA_CONTROLLER_QUORUM_FETCH_TIMEOUT_MS: 10000

services:
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    command: ["postgres", "-c", "wal_level=logical", "-c", "timezone=Asia/Ho_Chi_Minh"]
    volumes:
      - ./postgres-db-volumes:/var/lib/postgresql/data
      - ./ddl/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    # 1. This creates an isolated network for our Kafka cluster, ensuring secure communication between containers.
    networks:
      - kafka-net

  kafka1:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka1
    container_name: kafka1

    ports:
      - "9093:9093"
      - "9092:9092"
    
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 1
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: 'PLAINTEXT://kafka1:9092,CONTROLLER://kafka1:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka1:9092'
    volumes:
      - ./kafka-cluster-volumes/kafka1/data:/var/lib/kafka/data
    networks:
      - kafka-net

  kafka2:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka2
    container_name: kafka2

    ports:
      - "9095:9093"
      - "9094:9092"
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: 2
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: 'PLAINTEXT://kafka2:9092,CONTROLLER://kafka2:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka2:9092'
    volumes:
      - ./kafka-cluster-volumes/kafka2/data:/var/lib/kafka/data
    networks:
      - kafka-net

  kafka3:
      image: confluentinc/cp-kafka:7.8.0
      hostname: kafka3
      container_name: kafka3

      ports:
        - "9097:9093"
        - "9096:9092"
      environment:
        <<: *kafka-common
        KAFKA_NODE_ID: 3
        KAFKA_BROKER_ID: 3
        KAFKA_LISTENERS: 'PLAINTEXT://kafka3:9092,CONTROLLER://kafka3:9093'
        KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka3:9092'
      volumes:
        - ./kafka-cluster-volumes/kafka3/data:/var/lib/kafka/data
      networks:
        - kafka-net
  
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kconnect:8083
      KAFKA_CLUSTERS_0_PROPERTIES_DEFAULT_API_TIMEOUT_MS: 120000
      KAFKA_CLUSTERS_0_PROPERTIES_REQUEST_TIMEOUT_MS: 120000
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - kconnect
    networks:
      - kafka-net
  
  kconnect:
    image: debezium/connect:1.9
    container_name: kconnect
    ports:
      - 8083:8083
    environment:
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - postgres
    
    networks:
      - kafka-net
  
  simulator:
    build:
      context: .
      dockerfile: Dockerfile
      target: simulator
    container_name: simulator
    ports:
      - "8000:8000"
    volumes:
      - ./simulator:/app
    environment:
      - PG_HOST=${PG_HOST}
      - PG_PORT=5432
      - PG_DATABASE=${PG_DATABASE}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
    depends_on:
      - postgres
    networks:
      - kafka-net

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
      target: spark
    container_name: spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    networks:
      - kafka-net
    ports:
      - "7070:8080"
      - "7077:7077"
      - "4040:4040"
    environment:
      HOME: /tmp
      KAFKA_CONNECTOR_PACKAGE: org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.0
    volumes:
      - ./spark:/app

  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: spark
    hostname: spark-worker-1
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8091:8091"
    networks:
      - kafka-net
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_WEBUI_PORT: 8091
      SPARK_PUBLIC_DNS: localhost
    volumes:
      - ./spark:/app

  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: spark
    hostname: spark-worker-2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8092:8092"
    networks:
      - kafka-net
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_WEBUI_PORT: 8092
      SPARK_PUBLIC_DNS: localhost
    volumes:
      - ./spark:/app

  spark-history-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: spark
    container_name: spark-history-server
    hostname: spark-history-server
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.history.HistoryServer
    environment:
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=/data/spark-events
    ports:
      - "18080:18080"
    networks:
      - kafka-net
    volumes:
      - ./spark-volumes/data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-13T22-19-12Z
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./minio-volumes:/data
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=minio_password
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: server --console-address ":9001" /data
    networks:
      - kafka-net

  minio-init:
    image: quay.io/minio/mc:latest
    entrypoint: sh
    command: >
      -c "
      mc alias set local http://minio:9000 admin minio_password &&
      mc mb -p local/lakehouse &&
      mc mb -p local/data
      "
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - kafka-net