# Entry point: mỗi nhóm service nằm trong một file riêng ở compose/.
# project_directory: . để mọi đường dẫn tương đối (volumes, build context) và .env
# vẫn resolve từ thư mục gốc repo, giống như khi còn một file duy nhất.
include:
  - path: compose/postgres.yml
    project_directory: .
  - path: compose/tooling-db.yml
    project_directory: .
  - path: compose/kafka.yml
    project_directory: .
  - path: compose/storage.yml
    project_directory: .
  - path: compose/spark.yml
    project_directory: .
  - path: compose/bi.yml
    project_directory: .
  - path: compose/simulator.yml
    project_directory: .

networks:
  kafka-net:
    driver: bridge
  # Vùng mạng của backend (OLTP): chỉ postgres, simulator (đóng vai backend app)
  # và kconnect (cầu nối CDC duy nhất sang data platform) được gắn vào.
  backend-net:
    driver: bridge
